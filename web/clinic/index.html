<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved light/dark choice before the page paints (see src/lib/theme.tsx).
      try {
        var t = localStorage.getItem("team12-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- ?v=2: a new address so browsers drop the old cached icon. PNGs for browsers without SVG tab icons and for home screens. -->
    <link rel="icon" type="image/svg+xml" href="../favicon-clinic.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-clinic-32.png?v=2" />
    <link rel="apple-touch-icon" href="../favicon-clinic-180.png?v=2" />
    <meta name="description" content="Clinic staff portal: waitlist, imports, estimates. Course prototype (CS 497 Team 12); synthetic data only." />
    <meta name="apple-mobile-web-app-title" content="ClearWait Clinic" />
    <meta name="application-name" content="ClearWait Clinic" />
    <title>ClearWait · Clinic portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/clinic-main.tsx"></script>
  </body>
</html>
