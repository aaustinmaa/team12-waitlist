<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved light/dark choice before the page paints (see src/lib/theme.tsx).
      try {
        var t = localStorage.getItem("team12-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Check your child's referral and wait estimate. Course prototype (CS 497 Team 12); synthetic data only." />
    <meta name="apple-mobile-web-app-title" content="ClearWait" />
    <meta name="application-name" content="ClearWait" />
    <title>ClearWait · Families</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/family-main.tsx"></script>
  </body>
</html>
