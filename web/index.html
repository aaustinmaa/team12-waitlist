<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved light/dark choice before the page paints (see src/lib/theme.tsx).
      try {
        var t = localStorage.getItem("team12-theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#181d25");
        }
      } catch (e) {}
    </script>
    <!-- ?v=2: a new address so browsers drop the old cached icon. PNGs for browsers without SVG tab icons and for home screens. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="./favicon-180.png?v=2" />
    <meta name="description" content="Check your child's referral and wait estimate. Course prototype (CS 497 Team 12); synthetic data only." />
    <meta name="apple-mobile-web-app-title" content="ClearWait" />
    <meta name="application-name" content="ClearWait" />
    <title>ClearWait · Families</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/family-main.tsx"></script>
  </body>
</html>
